<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Urine Decontamination</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: field tool. Big cross-section stage, script card beside it, step controls under. Single dark look (Coconut black). */
:root{
  --bg:#000000; --panel:#0E1013; --line:#23272D; --fg:#FFFFFF; --muted:#9AA1A9;
  --blue:#1BA9FA; --gold:#BE9B60; --bact:#9BD14B;
  --display:"Montserrat",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header img{height:26px;width:auto;display:block}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:10px 10px;text-align:left;cursor:pointer;font:600 13px/1.25 var(--body);display:flex;flex-direction:column;gap:4px;min-width:0}
.chip b{font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-current="step"]{border-color:var(--blue);color:var(--fg);background:#06233A}
.chip[aria-current="step"] b{color:var(--blue)}
.chip.done{color:#C9CED4}
.chip:focus-visible,.btn:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.eyebrow.bad{color:var(--gold)}
h1{font:800 30px/1.1 var(--display);margin:0;text-wrap:balance}
.say{font-size:17px;line-height:1.55;color:#E4E7EA;margin:0}
.key{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.key div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:12px 18px;font:700 15px var(--display);cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#00131F}
.btn:disabled{opacity:.35;cursor:default}
.scrub{flex:1;display:flex;align-items:center;gap:10px;min-width:180px}
.scrub label{font:600 12px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
input[type=range]{flex:1;accent-color:var(--blue);min-width:0}
.foot{font-size:12px;color:var(--muted);line-height:1.5}
.foot a{color:var(--muted)}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(4,minmax(0,1fr))}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

const W=700,H=660,DX=40,DY=130;           // diagram placement inside canvas
const yT=60,yF=420,yB=456,yP=571,yS=655,SX0=219,SX1=481;

const STEPS=[
 {name:"Accident",eb:"What happened",title:"It starts on top",dur:3200,

 {name:"Saturation",eb:"What's underneath",title:"It soaks all the way down",dur:4200,

 {name:"Decontamination",eb:"The Coconut treatment",title:"Coconut Urine Decontamination",dur:6500,

const KEYS=["puddle","depth","bacteria","odor","spray","residue","rewick","treat","dwell","extract","damp","dry"];

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const off=document.createElement("canvas");off.width=W;off.height=H;const octx=off.getContext("2d");
const row=document.createElement("canvas");row.width=1;row.height=H;const rctx=row.getContext("2d");const rowData=rctx.createImageData(1,H);
const imgs={};let ready=0;
for(const k in IMG){const im=new Image();im.onload=()=>{if(++ready===4)init()};im.src=IMG[k];imgs[k]=im;}

let step=0,prog=0,playing=true,last=0,bact=[],resid=[],odorSeeds=[];
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}

function init(){
  const m=document.createElement("canvas");m.width=W;m.height=H;const mc=m.getContext("2d");mc.drawImage(imgs.mask,0,0,W,H);
  const md=mc.getImageData(0,0,W,H).data;const r=rnd(42);
  let tries=0;
  while(bact.length<170&&tries<60000){tries++;const x=r()*W,y=yT+15+r()*(yS-yT-25);
    const a=md[((y|0)*W+(x|0))*4+3];if(a<170)continue;
    if(y<yB&&r()>.45)continue;
    bact.push({x,y,a:r()*6.28,s:.8+r()*.6,ph:r()*6.28});}
  while(bact.length<270){const x=SX0+r()*(SX1-SX0),y=yT+10+r()*140;bact.push({x,y,a:r()*6.28,s:.8+r()*.6,ph:r()*6.28,top:true});}
  for(let i=0;i<420;i++)resid.push({x:SX0-8+r()*(SX1-SX0+16),y:yT-6+r()*150,r:1+r()*2.6,g:r()});
  for(let i=0;i<7;i++)odorSeeds.push({x:SX0+30+i*(SX1-SX0-60)/6,ph:r()*6.28,sp:.6+r()*.5});
  buildChips();go(0);requestAnimationFrame(tick);
}

function stateAt(i,p){
  const s={};KEYS.forEach(k=>s[k]=0);
  for(let j=0;j<=i;j++){const t=j<i?1:p;
    for(const [k,a,b,w0,w1] of STEPS[j].an){const q=ss(w0,w1,t);if(j<i||q>0||t>=w0)s[k]=lerp(a,b,q);}}
  return s;
}

// vertical visibility of the stain (and treatment) per row
function topCleanY(s){return s.spray>0?yT-40+s.spray*(1-.75*s.rewick)*165:-1e9}
function depthY(s){return yT-10+s.depth*(yS-yT+30)}
function clearY(s){return yS+20-s.extract*(yS-yT+110)}
function clearF(s,y){const c=clearY(s);return 1-ss(c-30,c,y)}
function stainRow(s,y){const t=topCleanY(s),d=depthY(s);return ss(t,t+25,y)*(1-ss(d-30,d,y))*clearF(s,y)}
function treatRow(s,y){const d=yT-30+s.treat*(yS-yT+50);return (1-ss(d-30,d,y))*clearF(s,y)}

function layer(img,rowFn,tint){
  octx.globalCompositeOperation="source-over";octx.clearRect(0,0,W,H);octx.drawImage(img,0,0,W,H);
  if(tint){octx.globalCompositeOperation="source-in";octx.fillStyle=tint;octx.fillRect(0,0,W,H);}
  const d=rowData.data;for(let y=0;y<H;y++){const a=Math.round(255*rowFn(y));d[y*4]=d[y*4+1]=d[y*4+2]=255;d[y*4+3]=a;}
  rctx.putImageData(rowData,0,0);
  octx.globalCompositeOperation="destination-in";octx.drawImage(row,0,0,W,H);octx.globalCompositeOperation="source-over";
  return off;
}

function draw(now){
  const s=stateAt(step,prog),T=now/1000;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.translate(DX,DY);
  ctx.drawImage(imgs.clean,0,0,W,H);
  // urine saturation
  ctx.drawImage(layer(imgs.stain,y=>stainRow(s,y)),0,0);
  // treatment
  if(s.treat>0){ctx.globalAlpha=.55-.15*s.dwell;ctx.drawImage(layer(imgs.mask,y=>treatRow(s,y),"#1BA9FA"),0,0);ctx.globalAlpha=1;}
  // dampness after rinse
  if(s.damp>0.01){ctx.globalAlpha=.4*s.damp;ctx.drawImage(layer(imgs.mask,y=>1,"#0B2233"),0,0);ctx.globalAlpha=1;}
  // residue film
  if(s.residue>0){const f=s.residue*clearF(s,yT+60)*(1-.6*s.treat);
    for(const p of resid){ctx.globalAlpha=f*(.35+.5*p.g);ctx.fillStyle=p.g>.8?"#FFFFFF":"#E9E1CC";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
    ctx.globalAlpha=f*.25;ctx.fillStyle="#F3EEDF";ctx.fillRect(SX0-6,yT-8,SX1-SX0+12,10);ctx.globalAlpha=1;}
  // puddle
  if(s.puddle>0){ctx.globalAlpha=Math.min(1,s.puddle*1.4)*clearF(s,yT-20);const sh=.55+.45*s.puddle;
    ctx.save();ctx.translate(0,(yT+20)*(1-sh));ctx.scale(1,sh);ctx.drawImage(imgs.puddle,0,0,W,H);ctx.restore();ctx.globalAlpha=1;}
  // bacteria
  const lvl=s.bacteria,kill=1-ss(0,.85,s.dwell),tc=topCleanY(s),dy=depthY(s);
  if(lvl>0&&kill>0){
    bact.forEach((b,i)=>{let a=b.top?Math.min(1,Math.max(0,(lvl-1)*220-(i-170))):Math.min(1,Math.max(0,lvl*170-i));
      if(a<=0)return;if(b.y<tc&&!b.top)a*=.15;if(b.y>dy)return;a*=kill*clearF(s,b.y);if(a<=.01)return;
      const jx=Math.sin(T*1.7+b.ph)*1.6,jy=Math.cos(T*1.3+b.ph)*1.6,sc=b.s*(.6+.4*kill);
      ctx.save();ctx.translate(b.x+jx,b.y+jy);ctx.rotate(b.a+Math.sin(T+b.ph)*.3);ctx.globalAlpha=a;
      ctx.fillStyle="#1E2A0E";roundRect(-6.5*sc,-3.2*sc,13*sc,6.4*sc,3.2*sc);ctx.fill();
      ctx.fillStyle=s.dwell>0?mix("#9BD14B","#6E6E6E",s.dwell):"#9BD14B";roundRect(-5.3*sc,-2.1*sc,10.6*sc,4.2*sc,2.1*sc);ctx.fill();
      ctx.restore();});ctx.globalAlpha=1;}
  // odor
  if(s.odor>0.01){ctx.lineWidth=3;ctx.lineCap="round";
    odorSeeds.forEach(o=>{for(let k=0;k<2;k++){const ph=((T*o.sp*.35+k*.5+o.ph)%1);const y0=yT-30-ph*95;
      ctx.globalAlpha=s.odor*Math.sin(Math.PI*ph)*.8;ctx.strokeStyle="#C9C27A";ctx.beginPath();
      for(let q=0;q<=24;q++){const yy=y0-q*1.6,xx=o.x+Math.sin(q*.45+T*2+o.ph)*6;q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}});
    ctx.globalAlpha=1;}
  // spray bottle + mist
  if(step===3&&prog<.5){const a=1-ss(.38,.5,prog),pr=ss(0,.42,prog);ctx.globalAlpha=a;
    drawBottle(SX0-150,yT-120,"#E8E8E8","SPOT");ctx.fillStyle="#DDE9F2";
    for(let i=0;i<60;i++){const u=(i*.618+T*1.8)%1,ang=-.15+((i*7)%11)/11*.75;ctx.globalAlpha=a*pr*(1-u)*.8;
      ctx.beginPath();ctx.arc(SX0-95+Math.cos(ang)*u*230,yT-100+Math.sin(ang)*u*150+u*u*20,2.2,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;}
  // pour
  if(step===4&&prog<.55){const a=1-ss(.45,.55,prog),pr=ss(0,.08,prog);ctx.globalAlpha=a;
    drawBottle(350-30,yT-128,"#1BA9FA","UN-DUZ-IT",true);
    ctx.fillStyle="#1BA9FA";ctx.globalAlpha=a*pr*.9;const w=10+Math.sin(T*9)*1.5;roundRect(350-w/2,yT-62,w,62,w/2);ctx.fill();ctx.globalAlpha=1;}
  // dwell timer
  if(step===4&&prog>.45){const mins=Math.round(ss(.5,1,prog)*60);ctx.globalAlpha=ss(.45,.55,prog);
    ctx.fillStyle="#06233A";roundRect(W-190,-60,190,48,12);ctx.fill();ctx.strokeStyle="#1BA9FA";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#FFFFFF";ctx.font="600 20px 'JetBrains Mono', monospace";ctx.textAlign="center";ctx.fillText("DWELL "+String(mins).padStart(2,"0")+":00",W-95,-29);ctx.textAlign="left";ctx.globalAlpha=1;}
  // extraction wand + flow
  if(step===5){const a=ss(0,.08,prog)*(1-ss(.92,1,prog));
    if(a>0){const wx=350+Math.sin(T*1.6)*70,wy=yT-58;ctx.globalAlpha=a;
      const c=clearY(s);
      for(let i=0;i<140;i++){const u=((i*.37+T*.9)%1),lane=((i*53)%100)/100;
        const yy=yS-u*(yS-yT+40);if(yy>c+40)continue;const spread=yy>yB?140:yy>yF?80:20;
        const xx=lerp(SX0-spread,SX1+spread,lane)*(1-u*.35)+wx*u*.35;
        ctx.globalAlpha=a*.85*Math.sin(Math.PI*u);ctx.fillStyle=i%3?"#8FD8FF":"#FFFFFF";ctx.beginPath();ctx.arc(xx,yy,2.4,0,6.28);ctx.fill();}
      ctx.globalAlpha=a;drawWand(wx,wy);ctx.globalAlpha=1;}}
  // done badge
  if(step===5&&prog>.96){ctx.globalAlpha=ss(.96,1,prog);ctx.fillStyle="#1BA9FA";roundRect(W/2-170,-70,340,52,26);ctx.fill();
    ctx.fillStyle="#00131F";ctx.font="800 22px Montserrat, sans-serif";ctx.textAlign="center";ctx.fillText("CLEAN TOP TO BOTTOM",W/2,-36);ctx.textAlign="left";ctx.globalAlpha=1;}
  // dry time: air mover, airflow, vapor
  if(step===6){const a=s.dry;
    ctx.lineCap="round";
    for(let i=0;i<14;i++){const u=((i*.29+T*.8)%1),ly=yT-24-(i%5)*9,x0=150+u*(W-150);
      ctx.globalAlpha=a*.7*Math.sin(Math.PI*u)*(.4+.6*s.damp+.3);ctx.strokeStyle="#8FD8FF";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x0,ly);ctx.lineTo(x0+60,ly+Math.sin(T*3+i)*3);ctx.stroke();}
    for(const o of odorSeeds){const ph=((T*.45+o.ph)%1);ctx.globalAlpha=a*s.damp*Math.sin(Math.PI*ph)*.75;ctx.strokeStyle="#FFFFFF";ctx.lineWidth=2.5;
      ctx.beginPath();for(let q=0;q<=20;q++){const yy=yT-20-ph*80-q*1.8,xx=o.x+ph*40+Math.sin(q*.5+T*2+o.ph)*5;q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}
    ctx.globalAlpha=a;drawFan(-10,yT-122,T);ctx.globalAlpha=1;
    if(prog>.96){ctx.globalAlpha=ss(.96,1,prog);ctx.fillStyle="#1BA9FA";roundRect(W/2-150,-70,300,52,26);ctx.fill();
      ctx.fillStyle="#00131F";ctx.font="800 22px Montserrat, sans-serif";ctx.textAlign="center";ctx.fillText("CLEAN AND DRY",W/2,-36);ctx.textAlign="left";ctx.globalAlpha=1;}}
  // labels
  ctx.font="800 38px Montserrat, sans-serif";
  LAB.forEach(([t,y])=>{const x0=W+16;ctx.fillStyle="#3A3F45";ctx.fillRect(x0+10,y-2,58,4);ctx.fillStyle="#1BA9FA";ctx.beginPath();ctx.arc(x0+8,y,7,0,6.28);ctx.fill();
    ctx.fillStyle="#FFFFFF";const p=t.split("|");if(p.length===1)ctx.fillText(t,x0+84,y+13);else{ctx.fillText(p[0],x0+84,y-6);ctx.fillText(p[1],x0+84,y+36);}});
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return"rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"}
function drawBottle(x,y,col,label,tilt){ctx.save();ctx.translate(x,y);if(tilt)ctx.rotate(.0);
  ctx.fillStyle=col;roundRect(0,18,60,78,10);ctx.fill();ctx.fillStyle="#2A2E33";roundRect(14,0,32,22,5);ctx.fill();
  if(!tilt){ctx.fillRect(40,6,26,8);}
  ctx.fillStyle=tilt?"#00131F":"#555";ctx.font="700 11px 'JetBrains Mono', monospace";ctx.textAlign="center";ctx.fillText(label,30,62);ctx.restore();ctx.textAlign="left";}
function drawFan(x,y,T){ctx.save();ctx.translate(x,y);
  ctx.fillStyle="#1A1D21";roundRect(8,92,140,14,6);ctx.fill();
  const g=ctx.createLinearGradient(0,0,0,100);g.addColorStop(0,"#3FBBFF");g.addColorStop(1,"#0F7FC0");
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(20,96);ctx.bezierCurveTo(-10,60,10,0,70,0);ctx.bezierCurveTo(120,0,150,30,150,60);ctx.lineTo(178,62);ctx.lineTo(178,96);ctx.closePath();ctx.fill();
  ctx.fillStyle="#0A0C0E";ctx.beginPath();ctx.arc(72,50,34,0,6.283);ctx.fill();
  ctx.strokeStyle="#5C636B";ctx.lineWidth=2;for(let r=10;r<=34;r+=8){ctx.beginPath();ctx.arc(72,50,r,0,6.283);ctx.stroke();}
  ctx.save();ctx.translate(72,50);ctx.rotate(T*14);ctx.fillStyle="#C9CED4";ctx.globalAlpha*=.8;
  for(let k=0;k<5;k++){ctx.rotate(1.2566);ctx.beginPath();ctx.ellipse(14,0,14,5,0,0,6.283);ctx.fill();}ctx.restore();
  ctx.fillStyle="#0A0C0E";roundRect(170,64,12,30,3);ctx.fill();
  ctx.fillStyle="#FFFFFF";ctx.font="800 11px Montserrat, sans-serif";ctx.fillText("COCONUT",44,94);
  ctx.restore();}
function drawWand(x,y){ctx.save();
  const g=ctx.createLinearGradient(0,y-10,0,y+24);g.addColorStop(0,"#F4F6F8");g.addColorStop(.5,"#9CA3AB");g.addColorStop(1,"#5B6168");
  ctx.strokeStyle="#C9CED4";ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x+40,y);ctx.lineTo(x+150,y-140);ctx.stroke();
  ctx.fillStyle=g;roundRect(x-130,y-8,260,30,8);ctx.fill();ctx.fillStyle="#1BA9FA";ctx.fillRect(x-122,y+18,244,4);ctx.restore();}

function tick(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(playing){prog=Math.min(1,prog+dt*1000/STEPS[step].dur);if(prog>=1)playing=false;scrub.value=Math.round(prog*1000);}
  draw(now);requestAnimationFrame(tick);}

const stepsEl=document.getElementById("steps"),scrub=document.getElementById("scrub");
function buildChips(){STEPS.forEach((s,i)=>{const b=document.createElement("button");b.className="chip";b.id="chip"+i;
  b.innerHTML="<b>"+String(i+1).padStart(2,"0")+"</b><span>"+s.name+"</span>";b.onclick=()=>go(i);stepsEl.appendChild(b);});}
function go(i){step=Math.max(0,Math.min(STEPS.length-1,i));prog=0;playing=!matchMedia("(prefers-reduced-motion: reduce)").matches;if(!playing)prog=1;
  const s=STEPS[step];
  document.getElementById("eyebrow").textContent="Step "+(step+1)+" of "+STEPS.length+" · "+s.eb;
  document.getElementById("eyebrow").className="eyebrow"+(s.bad?" bad":"");
  document.getElementById("title").textContent=s.title;document.getElementById("say").textContent=s.say;
  document.getElementById("key").innerHTML=s.key.map(([c,t])=>'<div><span class="sw" style="background:'+c+'"></span>'+t+"</div>").join("");
  STEPS.forEach((_,j)=>{const c=document.getElementById("chip"+j);c.toggleAttribute("aria-current",j===step);if(j===step)c.setAttribute("aria-current","step");c.classList.toggle("done",j<step);});
  document.getElementById("back").disabled=step===0;
  document.getElementById("next").textContent=step===STEPS.length-1?"Start over":"Next";
}
document.getElementById("back").onclick=()=>go(step-1);
document.getElementById("next").onclick=()=>go(step===STEPS.length-1?0:step+1);
document.getElementById("replay").onclick=()=>{prog=0;playing=true;};
scrub.oninput=()=>{playing=false;prog=scrub.value/1000;};
document.addEventListener("keydown",e=>{if(e.target===scrub)return;if(e.key==="ArrowRight")go(step+1);if(e.key==="ArrowLeft")go(step-1);});
</script>

</body></html>
